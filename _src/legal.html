<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="{{description}}">
  <title>{{title}} — Panel Flow</title>
  <link rel="canonical" href="{{url}}">
{{alternates}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Panel Flow">
  <meta property="og:title" content="{{title}} — Panel Flow">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:locale" content="{{og_locale}}">
{{og_alternates}}
  <meta property="og:image" content="https://panel-flow.github.io/img/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{og_image_alt}}">
  <meta name="twitter:card" content="summary_large_image">
  <style>
:root{color-scheme:dark;--bg:#0d0e12;--surface:#171920;--ink:#f5f5f7;--muted:#c4c5ce;--line:#343641;--accent:#ff7188;--link:#ff9aab}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration-thickness:.08em;text-underline-offset:.18em}a:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:3px}.shell{width:min(100% - 36px,850px);margin-inline:auto}header{border-bottom:1px solid var(--line);background:#111217}header .shell{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-weight:750;text-decoration:none}.mark{width:29px;height:29px;border-radius:8px;background:linear-gradient(140deg,#ff9b86,#e74774);display:inline-grid;place-items:center;color:#161216;font-size:17px;font-weight:900}.home{font-size:.92rem}.language{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}.language a{display:block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;text-decoration:none;color:var(--muted)}.language a[aria-current=page]{border-color:var(--accent);color:var(--ink);background:#39212a}.main{padding-block:52px 72px}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px}.main h1{font-size:clamp(2.2rem,7vw,3.35rem);line-height:1.08;letter-spacing:-.035em;margin:0 0 14px}.intro{font-size:1.15rem;color:var(--muted);margin:0;max-width:48rem}.effective{display:inline-block;margin-top:16px;color:var(--muted);font-size:.88rem}.policy{display:grid;gap:16px;margin-top:34px}.section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,30px)}.section h2{font-size:1.17rem;line-height:1.35;margin:0 0 12px}.section p,.section li{color:var(--muted);font-size:.98rem}.section p{margin:0 0 12px}.section p:last-child{margin-bottom:0}.section ul{padding-left:1.25rem;margin:10px 0 0}.section li+li{margin-top:8px}.section a{overflow-wrap:anywhere}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.88rem}footer .shell{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}@media(max-width:560px){header .shell{padding-block:12px;align-items:flex-start;flex-direction:column}.main{padding-top:38px}.home{align-self:flex-end}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}.section strong{color:var(--ink)}.footer-links{display:flex;flex-wrap:wrap;gap:6px 16px}.section ul+p{margin-top:12px}
</style>
</head>
<body>
  <header><div class="shell"><a class="brand" href="index.html"><span class="mark" aria-hidden="true">P</span>Panel Flow</a><a class="home" href="index.html">{{home}}</a></div></header>
  <main class="shell main">
    <p class="eyebrow">{{eyebrow}}</p>
    <h1>{{title}}</h1>
    <p class="intro">{{intro}}</p>
{{effective}}    <nav class="language" aria-label="{{language}}"><ul class="language">{{languages}}</ul></nav>
    <div class="policy">{{sections}}</div>
  </main>
  <footer><div class="shell"><span>Panel Flow</span><nav class="footer-links" aria-label="{{footer}}">{{footer_links}}<a href="mailto:{{contact_email}}">{{contact}}: {{contact_email}}</a></nav></div></footer>
</body>
</html>
